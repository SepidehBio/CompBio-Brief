en:
  brand.tagline: "An open resource for computational biology"

  hero.eyebrow:  "CompBio Brief · Est. 2026"
  hero.title:    "An open resource for computational biology."
  hero.subtitle: "Documenting practical knowledge in computational biology, bioinformatics and biomedical data analysis — written with clarity and care."
  hero.cta.tools: "Explore tools"
  hero.cta.notes: "Read notes"

  section.tools: "Tools & resources"
  section.tools.subtitle: "Curated software for sequence analysis, single-cell work, variant interpretation and machine learning — with input, output and installation notes."
  section.tools.link: "View all tools"

  section.notes: "Recent notes"
  section.notes.subtitle: "Short, original notes on methodology, reproducibility and the practice of computational research."
  section.notes.link: "All notes"

  section.datasets: "Public datasets"
  section.datasets.subtitle: "A short list of openly available datasets frequently used in computational biology — with organism, type and access."
  section.datasets.link: "Browse datasets"

  section.tutorials: "Tutorials"
  section.tutorials.subtitle: "Practical guides for common computational biology tasks, from data preparation and quality control to model evaluation and reproducible workflows."
  section.tutorials.link: "Explore tutorials"
  section.tutorials.empty: "Tutorials are being prepared. The first set will cover single-cell quality control, RNA-seq alignment and spatial integration."

  tools.count: "tools"

  datasets.col.name: "Dataset"
  datasets.col.organism: "Organism"
  datasets.col.type: "Data type"
  datasets.col.access: "Access"

  home.closing.title: "Built for practical computational work"
  home.closing.body: "CompBio Brief brings together concise notes, curated tools, public datasets and practical workflows for computational biology and biomedical data analysis."
  home.closing.body2: "The focus is simple: useful information, clear explanations and reproducible practice."

  footer.copy:    "© 2026 CompBio Brief · Built with care."
  footer.online:  "readers online now"
  footer.rights:  "All content licensed CC BY 4.0 · Code MIT"

  meta.theme.toggle:  "Toggle theme"
  meta.lang.switch:   "Change language"

  categories:
    sequence-analysis:
      title: "Sequence Analysis"
      description: "Tools for alignment, annotation and comparative work with nucleotide and protein sequences."
    single-cell:
      title: "Single-Cell Analysis"
      description: "Frameworks for single-cell RNA-seq, integration and spatial transcriptomics."
    variant-analysis:
      title: "Variant Analysis"
      description: "Tools for calling, annotating and interpreting genetic variants from sequencing data."
    machine-learning:
      title: "Machine Learning"
      description: "General-purpose tools for predictive modelling and deep learning on biomedical data."

