fa:
  brand.tagline: "منبعی باز برای بیولوژی محاسباتی"

  hero.eyebrow:  "CompBio Brief · از ۲۰۲۶"
  hero.title:    "منبعی باز برای بیولوژی محاسباتی."
  hero.subtitle: "مستندسازی دانش کاربردی در بیولوژی محاسباتی، بیوانفورماتیک و تحلیل داده‌های زیست‌پزشکی — با شفافیت و دقت."
  hero.cta.tools: "کاوش در ابزارها"
  hero.cta.notes: "خواندن یادداشت‌ها"

  section.tools: "ابزارها و منابع"
  section.tools.subtitle: "نرم‌افزارهای گزیده برای تحلیل توالی، کار تک‌سلولی، تفسیر واریانت و یادگیری ماشین — همراه با ورودی، خروجی و نکات نصب."
  section.tools.link: "مشاهده‌ی همه‌ی ابزارها"

  section.notes: "یادداشت‌های اخیر"
  section.notes.subtitle: "یادداشت‌های کوتاه و اصیل درباره‌ی روش‌شناسی، بازتولیدپذیری و رویه‌ی پژوهش محاسباتی."
  section.notes.link: "همه‌ی یادداشت‌ها"

  section.datasets: "داده‌های عمومی"
  section.datasets.subtitle: "فهرست کوتاهی از داده‌های باز و پرکاربرد در بیولوژی محاسباتی — همراه با ارگانیسم، نوع و نحوه‌ی دسترسی."
  section.datasets.link: "مرور داده‌ها"

  section.tutorials: "آموزش‌ها"
  section.tutorials.subtitle: "راهنماهای کاربردی برای کارهای رایج در بیولوژی محاسباتی — از آماده‌سازی داده و کنترل کیفیت تا ارزیابی مدل و گردش‌کارهای بازتولیدپذیر."
  section.tutorials.link: "کاوش در آموزش‌ها"
  section.tutorials.empty: "آموزش‌ها در حال آماده‌سازی هستند. مجموعه‌ی اول شامل کنترل کیفیت تک‌سلولی، هم‌ترازی RNA-seq و ادغام فضایی خواهد بود."

  tools.count: "ابزار"

  datasets.col.name: "داده"
  datasets.col.organism: "ارگانیسم"
  datasets.col.type: "نوع داده"
  datasets.col.access: "دسترسی"

  home.closing.title: "ساخته‌شده برای کار محاسباتی کاربردی"
  home.closing.body: "CompBio Brief یادداشت‌های کوتاه، ابزارهای گزیده، داده‌های عمومی و گردش‌کارهای کاربردی را برای بیولوژی محاسباتی و تحلیل داده‌های زیست‌پزشکی گرد هم می‌آورد."
  home.closing.body2: "تمرکز ساده است: اطلاعات مفید، توضیح روشن و رویه‌ی بازتولیدپذیر."

  footer.copy:    "© ۲۰۲۶ CompBio Brief · با دقت ساخته شده."
  footer.online:  "خواننده آنلاین"
  footer.rights:  "همه‌ی محتوا تحت CC BY 4.0 · کد تحت MIT"

  meta.theme.toggle:  "تغییر پوسته"
  meta.lang.switch:   "تغییر زبان"

  categories:
    sequence-analysis:
      title: "تحلیل توالی"
      description: "ابزارهایی برای هم‌ترازی، حاشیه‌نویسی و کار مقایسه‌ای روی توالی‌های نوکلئوتیدی و پروتئینی."
    single-cell:
      title: "تحلیل تک‌سلولی"
      description: "چارچوب‌هایی برای scRNA-seq، ادغام داده‌ها و ترانسکریپتومیکس فضایی."
    variant-analysis:
      title: "تحلیل واریانت"
      description: "ابزارهایی برای فراخوانی، حاشیه‌نویسی و تفسیر واریانت‌های ژنتیکی از داده‌های توالی‌یابی."
    machine-learning:
      title: "یادگیری ماشین"
      description: "ابزارهای عمومی برای مدل‌سازی پیش‌بین و یادگیری عمیق روی داده‌های زیست‌پزشکی."
