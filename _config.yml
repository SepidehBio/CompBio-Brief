title: CompBio Brief
tagline: Brief notes on computational biology, research software, and scientific practice
description: >-
  An open notebook on computational biology — tools, datasets, and
  research notes. Trilingual (EN/DA/FA), built from scratch.

author:
  name: CompBio Brief
  email: hello@example.com

languages:
  - code: en
    name: English
    native: English
    dir: ltr
    flag: "🇬🇧"
  - code: da
    name: Danish
    native: Dansk
    dir: ltr
    flag: "🇩🇰"
  - code: fa
    name: Persian
    native: فارسی
    dir: rtl
    flag: "🇮🇷"

default_lang: en

url: "https://<username>.github.io"
baseurl: "/compbio-brief"

markdown: kramdown
highlighter: rouge
permalink: /notes/:year/:month/:day/:title/

kramdown:
  input: GFM
  syntax_highlighter: rouge

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

collections:
  tutorials:
    output: true
    permalink: /tutorials/:name/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: tutorials
    values:
      layout: page

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - README.md
  - LICENSE
