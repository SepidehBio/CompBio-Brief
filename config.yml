# ============================================
#  CompBio Lab — Jekyll Configuration
#  Trilingual: English · Dansk · فارسی
# ============================================

title: CompBio Lab
tagline: Notes on computational biology, research software, and scientific practice
description: >-
  A practical, open resource for computational biology, bioinformatics
  and biomedical data analysis — written by hand, in English, Danish and Persian.

author:
  name: CompBio Lab
  email: hello@example.com

# --- Languages (first = default) ---
languages:
  - code: en
    name: English
    native: English
    dir: ltr
    flag: "🇬🇧"
  - code: da
    name: Danish
    native: Dansk
    dir: ltr
    flag: "🇩🇰"
  - code: fa
    name: Persian
    native: فارسی
    dir: rtl
    flag: "🇮🇷"

default_lang: en

# --- URLs ---
url: "https://<username>.github.io"
baseurl: ""

# --- Build ---
markdown: kramdown
highlighter: rouge
permalink: /notes/:year/:month/:day/:title/

kramdown:
  input: GFM
  syntax_highlighter: rouge

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

collections:
  tutorials:
    output: true
    permalink: /tutorials/:name/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: tutorials
    values:
      layout: page

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - README.md
  - LICENSE
