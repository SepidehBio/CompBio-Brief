# ============================================
#  CompBio Lab — Jekyll Configuration
#  A quiet, open notebook for computational biology
# ============================================

title: CompBio Lab
tagline: Notes on computational biology, research software, and scientific practice
description: >-
  A practical, open resource for computational biology, bioinformatics
  and biomedical data analysis — written by hand, in English and Persian.

# --- Author / brand ---
author:
  name: CompBio Lab
  email: hello@example.com

# --- URLs ---
# اگر مخزن را comp-bio.github.io ساختید:
url: "https://<username>.github.io"
baseurl: ""

# اگر مخزن را با نام دیگری ساختید (مثلاً compbio-lab):
# baseurl: "/compbio-lab"

# --- Build settings ---
markdown: kramdown
highlighter: rouge
permalink: /notes/:year/:month/:day/:title/

kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: false

# --- Plugins (همه در GitHub Pages پشتیبانی می‌شوند) ---
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# --- Collections ---
collections:
  tutorials:
    output: true
    permalink: /tutorials/:name/

# --- Defaults ---
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: tutorials
    values:
      layout: page

# --- Exclude ---
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - README.md
  - LICENSE
